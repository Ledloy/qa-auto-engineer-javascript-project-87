name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@latest 

      - run: npm ci 
      - run: npm run test  
      - run: npm run test-coverage  


      - name: Fix sonar-report.xml paths for SonarQube
        run: |
          ESCAPED_PATH=$(echo "$GITHUB_WORKSPACE" | sed 's/[\/&]/\\&/g')
          sed -i "s|$ESCAPED_PATH/||g" coverage/sonar-report.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}